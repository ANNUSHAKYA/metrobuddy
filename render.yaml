services:
  - type: web
    name: metrobuddy-backend
    env: node
    region: singapore
    buildCommand: cd backend && npm install
    startCommand: cd backend && PORT=5001 node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_PROVIDER
        value: mock
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
